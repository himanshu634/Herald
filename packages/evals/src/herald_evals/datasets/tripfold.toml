sender = "vikram.sethi@rediffmail.com"
subject = "Refund pending for 3 weeks - final reminder"
body = """
My return was picked up on the 2nd and I still have no refund. I have written four times.
If the money is not in my account by Friday, I am filing a complaint on the National
Consumer Helpline and with the e-Daakhil portal.
"""
note = "A consumer complaint threat. The word check knows 'consumer forum' and 'consumer court', not these."
[cases.expect]
route = "alert"
topic = "Payments and refunds"
flags = ["legal_threat"]

