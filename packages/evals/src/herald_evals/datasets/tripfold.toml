# Tripfold, the demo luggage brand. The config is the seed itself, so the eval measures what
# the product ships. Every case below was drafted with an AI's help: set `reviewed = true`
# only after a person has read the email and agrees with its label.
#
# Labels say what Herald *should* do for the owner (docs/product-scope.md), not what it does
# today. A label that disagrees with the code on purpose says why in `note`.

business = "Tripfold"
config_ref = "herald_server.seed:TRIPFOLD"

# ---------------------------------------------------------------- should alert

[[cases]]
id = "flight-tomorrow-polite"
tags = ["calm_urgent", "rule"]
sender = "priya.nair84@gmail.com"
subject = "Order TF-20931 still in transit"
body = """
Hi Tripfold team,

Hope you're well. I ordered the Aero cabin trolley (order TF-20931) last week and the
tracking still says "in transit". I fly to Singapore tomorrow at 7 am and was really hoping
to take it with me.

Is there anything you can do? No worries if not, just wanted to check.

Thanks,
Priya
"""
[cases.expect]
route = "alert"
topic = "Orders and delivery"
rules = { travel-soon = true, damaged = false, corporate = false }
urgency = ["urgent", "high"]
anger = [1, 2]

[[cases]]
id = "hinglish-flight-tomorrow"
tags = ["calm_urgent", "rule", "other_language"]
sender = "rahul.k.verma@yahoo.co.in"
subject = "order kab aayega??"
body = """
Hello, mera order TF-21877 abhi tak nahi aaya. Kal raat ki flight hai Dubai ke liye, aur
bag usi ke liye liya tha. Please aaj deliver ho sakta hai kya? Address Andheri East hai.
"""
note = "Hindi in Latin script mixed with English is how many Indian customers write. It is readable, so it should be judged, not sent to needs a look."
[cases.expect]
route = "alert"
topic = "Orders and delivery"
rules = { travel-soon = true }

[[cases]]
id = "airport-handle-snapped"
tags = ["calm_urgent", "rule", "rule_conflict"]
sender = "arjun.mehta@outlook.com"
subject = "Handle broke at the airport"
body = """
I'm at Bengaluru airport right now and the telescopic handle on my Tripfold Voyager just
snapped off at check-in. I have a connecting flight in Delhi and can't drag a 23 kg bag
through the terminal like this. The bag arrived last month.

What can you do? I board in two hours.
"""
note = "The profile names this exact bad day. The `damaged` rule sets urgency to high, which can override the AI's urgent and stop the alert: the label is alert because the owner would want to know."
[cases.expect]
route = "alert"
topic = ["Damaged or defective", "Warranty claims"]
rules = { damaged = true, travel-soon = false }
urgency = "urgent"

[[cases]]
id = "corporate-bulk-enquiry"
tags = ["rule"]
sender = "anita.desai@kestrel-analytics.example"
subject = "Branded cabin bags for 250 employees"
body = """
Hello,

We're planning our annual offsite in January and would like 250 cabin bags with our logo
printed on the front. Could you share bulk pricing, lead time and whether you can deliver to
three offices (Pune, Hyderabad, Gurugram)?

Regards,
Anita Desai
People Operations, Kestrel Analytics
"""
[cases.expect]
route = "alert"
topic = "Corporate gifting"
rules = { corporate = true, travel-soon = false }

[[cases]]
id = "important-contact-annoyed"
tags = ["important_contact", "rule"]
sender = "corporate-gifts@bigcorp.example"
subject = "Re: PO 4471 - 120 duffels"
body = """
We were promised the 120 duffels by the 15th. It's the 18th and nobody has told us anything.
Our leadership event is on Monday and I've now had to explain this twice upstairs. This is
