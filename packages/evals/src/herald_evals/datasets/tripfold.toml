[[cases]]
id = "all-caps-colour-rant"
tags = ["angry_routine"]
sender = "kiran.joshi77@gmail.com"
subject = "WRONG COLOUR!!!"
body = """
I ORDERED THE TEAL ONE AND THIS IS CLEARLY MORE GREEN THAN TEAL. YOUR WEBSITE PHOTOS ARE A
JOKE. WHAT IS THE POINT OF CHOOSING A COLOUR IF YOU SEND WHATEVER YOU WANT??? FIX THIS.
"""
note = "Angry but routine. Herald alerts at anger 5 by design (demo moment 5); the owner can then mark it Not urgent."
[cases.expect]
route = "alert"
topic = "Returns and exchanges"
anger = 5

[[cases]]
id = "third-follow-up"
tags = ["repeat_contact", "history"]
sender = "farah.siddiqui@gmail.com"
subject = "Following up again - order TF-19302"
body = """
Hi, following up again on order TF-19302. It's now 9 days and the tracking hasn't moved
since it left the Delhi hub. Could someone please look into it?
"""
note = "docs/product-scope.md alerts on 'a third email about the same thing': two earlier open emails on this topic this week."
[cases.expect]
route = "alert"
topic = "Orders and delivery"
[cases.history.sender]
first_seen_days_ago = 6
count_7d = 2
count_30d = 2
top_topics = ["Orders and delivery"]
recent = [
  { days_ago = 2, subject = "Order TF-19302 not moving", topic = "Orders and delivery", urgency = "normal", status = "inbox", summary = "Tracking stuck at Delhi hub." },
  { days_ago = 6, subject = "Where is my order TF-19302?", topic = "Orders and delivery", urgency = "normal", status = "inbox", summary = "Asks for delivery date." },
]

[[cases]]
id = "thread-flight-now-tomorrow"
tags = ["thread", "history", "calm_urgent", "rule"]
