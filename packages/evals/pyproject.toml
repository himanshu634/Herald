[project]
name = "herald-evals"
version = "0.1.0"
description = "Herald's triage evals: labelled test emails and the score report."
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.60",
    "herald-core",
    "herald-server",
]

[project.scripts]
herald-evals = "herald_evals.cli:main"

[tool.uv.sources]
herald-core = { workspace = true }
herald-server = { workspace = true }

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"
