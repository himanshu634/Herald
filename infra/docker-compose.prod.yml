# Herald in production: nginx serves the web app and proxies /api, with the API, the
# pipeline worker, Postgres and Redis behind it. Only nginx publishes a port.
#
#   make docker-prod
#
# Reads secrets from the repo root .env (see .env.example). Compose looks for .env next to
# this file, so run it through make, or pass `--env-file .env` from the repo root. Put TLS
# in front of HERALD_PORT.

# Its own project name, so it never shares volumes with the dev `herald` project. Postgres
# only applies POSTGRES_PASSWORD when it creates the volume, so a shared volume would keep
# the dev password.
name: herald-prod

x-server: &server
  build:
    context: ..
    dockerfile: infra/Dockerfile
    target: server
  image: herald-server
  restart: unless-stopped
  env_file:
    - path: ../.env
      required: false
  # Set here so a localhost value copied from .env.example cannot win.
  environment:
    HERALD_DATABASE_URL: postgresql+psycopg://herald:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/herald
    HERALD_REDIS_URL: redis://redis:6379/0
    HERALD_BUS: redis
    HERALD_QUEUE: arq
    HERALD_MODEL_PROVIDER: ${HERALD_MODEL_PROVIDER:-anthropic}
    HERALD_WEB_URL: ${HERALD_WEB_URL:-http://localhost:8080}
    # The worker calls the API's internal routes on the compose network. nginx proxies only
    # /api, so /internal is never reachable from outside.
    HERALD_INTERNAL_API_URL: http://api:8000
    HERALD_INTERNAL_TOKEN: ${HERALD_INTERNAL_TOKEN:?set HERALD_INTERNAL_TOKEN in .env}

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: herald
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: herald
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U herald"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    # arq keeps queued jobs in Redis. Without persistence a restart drops them and those
    # emails stay pending.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  # Brings the schema to the latest revision, then exits. The API and the worker refuse to
  # start on an older schema, so they wait for it to finish. A failed migration stops the
  # deploy here, before the new code serves anything.
  migrate:
    <<: *server
    command: ["python", "-m", "herald_server.migrate"]
    restart: "no"
    # The image healthcheck probes the API port, which this one-shot does not serve.
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *server
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    <<: *server
    command: ["arq", "herald_server.worker.main.WorkerSettings"]
    # The image healthcheck probes the API port, which the worker does not serve.
    healthcheck:
      disable: true
    # Every job calls the API's internal routes, so start once the API is up. The API itself
    # waits for the migration, so the schema is current by then.
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      target: web
    image: herald-web
    restart: unless-stopped
    ports:
      - "${HERALD_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
