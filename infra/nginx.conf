# Serves the SvelteKit SPA and proxies /api to FastAPI on one origin, so fetch and
# EventSource need no CORS and a future auth cookie just works.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Built assets have content hashes in their names, so they never change.
    location /_app/immutable/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /api/ {
        # No trailing slash: every FastAPI route starts with /api, and a trailing slash
        # here would strip it.
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE: with buffering on, nginx holds events until its buffer fills and the inbox
        # stops updating live. The long read timeout keeps idle streams open between events.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # SPA fallback: deep links such as /setup load index.html and the client router
    # takes over.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
