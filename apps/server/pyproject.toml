[project]
name = "herald-server"
version = "0.1.0"
description = "Herald API (FastAPI + SSE) and pipeline worker (arq)."
requires-python = ">=3.13"
dependencies = [
    "arq>=0.26",
    "asyncer>=0.0.8",
    "cryptography>=44",
    "fastapi>=0.135",
    "herald-core",
    "httpx>=0.28",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.10",
    "pyjwt[crypto]>=2.10",
    "redis>=5.2",
    "sqlmodel>=0.0.24",
    "uvicorn[standard]>=0.34",
]

[tool.uv.sources]
herald-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"
