# Virtual uv workspace root: holds dev tooling and shared config only.
[tool.uv.workspace]
members = ["packages/core", "apps/server"]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=8.3",
    "pytest-asyncio>=1.0",
    "ruff>=0.12",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "FAST"]

[tool.ruff.lint.isort]
known-first-party = ["herald_core", "herald_server"]

[tool.pytest.ini_options]
testpaths = ["packages/core/tests", "apps/server/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
