# Virtual uv workspace root: holds dev tooling and shared config only.
[tool.uv.workspace]
members = ["packages/core", "packages/evals", "apps/server"]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "langfuse>=5.1,<6",
    "openinference-instrumentation-anthropic>=3.3.0",
    "openinference-instrumentation-openai>=0.1",
    "pytest>=8.3",
    "pytest-asyncio>=1.0",
    "ruff>=0.12",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "FAST"]

[tool.ruff.lint.isort]
known-first-party = ["herald_core", "herald_evals", "herald_server", "scripted_model"]

[tool.pytest.ini_options]
testpaths = ["packages/core/tests", "packages/evals/tests", "apps/server/tests"]
pythonpath = ["tests_support"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: calls a real model provider; skipped without its API key"]
